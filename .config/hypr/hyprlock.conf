general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    pam:enabled = true
    fingerprint:enabled = false
}

animations {
    enabled = true
}

background {
    monitor =
    path = screenshot

    color = rgba(8, 10, 15, 1.0)

    blur_passes = 2
    blur_size = 6

    brightness = 0.35
    contrast = 1.0
    vibrancy = 0.0
}

label {
    monitor =

    text = $TIME
    color = rgba(169, 177, 214, 1.0)

    font_size = 54
    font_family = JetBrainsMono Nerd Font

    position = 0, 120

    halign = center
    valign = center
}

label {
    monitor =

    text = $USER
    color = rgba(86, 95, 137, 1.0)

    font_size = 13
    font_family = JetBrainsMono Nerd Font

    position = 0, 68

    halign = center
    valign = center
}

input-field {
    monitor =

    size = 320, 52
    position = 0, -10

    outline_thickness = 2

    outer_color = rgba(32, 38, 56, 1.0)
    inner_color = rgba(13, 16, 24, 1.0)
    font_color = rgba(169, 177, 214, 1.0)

    check_color = rgba(122, 162, 247, 1.0)
    fail_color = rgba(247, 118, 142, 1.0)

    font_family = JetBrainsMono Nerd Font

    placeholder_text = <span foreground="##565F89">Password</span>

    dots_size = 0.20
    dots_spacing = 0.20
    dots_center = true

    rounding = 3

    fade_on_empty = false
}
